<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Espace client — Récup tes Droits</title>
<meta name="description" content="Connecte-toi à ton espace client Récup tes Droits pour suivre l'avancement de ton dossier.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='33' fill='%23D7263D'/%3E%3Ccircle cx='50' cy='50' r='27' fill='%230B1B33'/%3E%3Cpath d='M 34,52 L 45,63 L 69,35' fill='none' stroke='%23F7F5EF' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/client.css">
</head>
<body data-page="client-auth" data-base="../">
<script src="../assets/js/store.js"></script>
<script src="../assets/js/chrome.js"></script>
<script src="../assets/js/client-connexion.js" defer></script>

<main id="contenu">
  <div class="app-shell">
    <div class="wrap">
      <div class="auth-card">
        <h1>Connexion</h1>
        <p class="auth-card__lede">Retrouve le suivi de ton dossier, tes documents et tes échanges avec Récup tes Droits.</p>

        <div id="rtd-connexion-status" class="form-status" role="status"></div>

        <form id="rtd-connexion-form" novalidate>
          <div class="field">
            <label for="cnx-email">Adresse email</label>
            <input type="email" id="cnx-email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="cnx-mdp">Mot de passe</label>
            <input type="password" id="cnx-mdp" name="motDePasse" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn--stamp btn--block">Se connecter</button>
        </form>

        <p class="auth-card__switch">Pas encore d'espace client ? <a href="inscription.html">Crée-le en 2 minutes</a>.</p>
      </div>
    </div>
  </div>
</main>
</body>
</html>
